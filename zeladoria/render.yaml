services:
  - type: web
    name: citizentech-zeladoria
    runtime: docker
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CITIZEN_USER
        sync: false
      - key: CITIZEN_PASSWORD
        sync: false
